name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

env:
  DOTNET_VERSION: 10.0.300

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify pinned .NET SDK
        shell: bash
        run: test "$(dotnet --version)" = "${DOTNET_VERSION}"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Validate architecture boundaries
        run: ./scripts/validate-architecture.sh

      - name: Build
        # Surface CS1591 (missing XML doc) warnings so any undocumented public API
        # is visible in the CI log. Warnings do not fail the build; a separate
        # effort (TreatWarningsAsErrors on CS1591) can be enabled later.
        run: dotnet build --no-restore --configuration Release /warnaserror:-

      - name: Validate Compose contracts
        env:
          DB_PASSWORD: ci-compose-db-password
          JWT_SECRET: ci-compose-jwt-secret-with-at-least-32-bytes
          ADMIN_EMAIL: ci-admin@example.com
          ADMIN_PASSWORD: ci-compose-admin-password
        run: ./scripts/validate-compose.sh

      - name: Validate release candidate workflows
        run: bash scripts/validate-release-workflows.sh

      - name: Test with coverage
        run: |
          dotnet test --no-build --configuration Release \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --results-directory ./coverage

      - name: PostgreSQL integration tests
        env:
          RUN_POSTGRES_TESTS: "true"
        run: |
          dotnet test tests/Merconiq.Tests/Merconiq.Tests.csproj \
            --no-build --configuration Release \
            --verbosity normal --filter "Category=PostgreSQL"

      - name: Install ReportGenerator
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.4.12
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Generate and enforce coverage report
        shell: bash
        run: |
          reportgenerator \
            -reports:"coverage/**/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"Html;TextSummary"
          cat coverage-report/Summary.txt
          line_coverage=$(sed -n 's/^  Line coverage: \([0-9.]*\)%.*/\1/p' coverage-report/Summary.txt)
          if [ -z "$line_coverage" ]; then
            echo "Unable to read line coverage from ReportGenerator summary" >&2
            exit 1
          fi
          awk -v coverage="$line_coverage" 'BEGIN {
            if (coverage < 70) {
              printf "Line coverage %.2f%% is below the 70%% CI minimum\n", coverage
              exit 1
            }
          }'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: |
            coverage/
            coverage-report/
          if-no-files-found: warn
          retention-days: 14

services:
  db:
    image: postgres:16-alpine
    container_name: inventory-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-InventoryDB}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-app
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - DISABLE_HTTPS=true
      - ConnectionStrings__DefaultConnection=Host=db;Database=${DB_NAME:-InventoryDB};Username=${DB_USER:-postgres};Password=${DB_PASSWORD}
      - JwtSettings__Secret=${JWT_SECRET:?Set JWT_SECRET in .env}
      - DataProtection__KeyStoragePath=/app/data/keys
    volumes:
      - dataprotection:/app/data
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  bootstrap-admin:
    profiles: ["bootstrap"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DISABLE_HTTPS=true
      - ConnectionStrings__DefaultConnection=Host=db;Database=${DB_NAME:-InventoryDB};Username=${DB_USER:-postgres};Password=${DB_PASSWORD}
      - JwtSettings__Secret=${JWT_SECRET:?Set JWT_SECRET in .env}
      - BootstrapAdmin__TenantId=${BOOTSTRAP_ADMIN_TENANT:-default}
      - BootstrapAdmin__Email=${BOOTSTRAP_ADMIN_EMAIL-}
      - BootstrapAdmin__Password=${BOOTSTRAP_ADMIN_PASSWORD-}
    command: ["--bootstrap-admin"]
    depends_on:
      db:
        condition: service_healthy

  migrator:
    profiles: ["migrations"]
    build:
      context: .
      dockerfile: Dockerfile.migrator
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DISABLE_HTTPS=true
      - ConnectionStrings__DefaultConnection=Host=db;Database=${DB_NAME:-InventoryDB};Username=${DB_USER:-postgres};Password=${DB_PASSWORD}
      - JwtSettings__Secret=${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
  dataprotection:
    driver: local

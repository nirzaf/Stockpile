services:
  db:
    ports:
      - "${DB_PORT:-5432}:5432"

  app:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_WATCH_RESTART_ON_RUDE_EDIT=true
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5000:5000"
    volumes:
      - ./Merconiq.Web:/src/Merconiq.Web:ro
      - ./Merconiq.Core:/src/Merconiq.Core:ro
      - ./Merconiq.Infrastructure:/src/Merconiq.Infrastructure:ro
      - app-logs:/app/logs
    develop:
      watch:
        - action: rebuild
          path: ./Merconiq.Web
        - action: rebuild
          path: ./Merconiq.Core
        - action: rebuild
          path: ./Merconiq.Infrastructure

volumes:
  app-logs:
    driver: local
